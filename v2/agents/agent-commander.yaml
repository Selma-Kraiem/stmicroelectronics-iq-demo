name: st-iq-commander-v2
description: Single-entry Commander with adaptive A2A routing and concurrent Tasks fan-out.
template:
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    - name: STIQ_V2_AGENT_ROLE
    - name: FOUNDRY_PROJECT_ENDPOINT
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    - name: MARKET_A2A_ENDPOINT
    - name: QUALITY_A2A_ENDPOINT
    - name: ENABLE_INSTRUMENTATION
